# One-click setup on Render: a free web service plus a free Postgres database.
databases:
  - name: baseline-db
    plan: free
    databaseName: baseline
    user: baseline

services:
  - type: web
    name: baseline
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baseline-db
          property: connectionString
